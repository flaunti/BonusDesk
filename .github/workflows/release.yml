name: Windows release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build BonusDesk
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name "BonusDesk" --icon "assets\bonusdesk.ico"
          --version-file "assets\version_info.txt"
          --add-data "assets;assets" main.py

      - name: Pack Windows build
        shell: pwsh
        run: Compress-Archive -Path "dist\BonusDesk\*" -DestinationPath "BonusDesk-Windows-x64.zip"

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $releaseTag = "${{ github.ref_name }}".Replace("release-", "")
          $version = $releaseTag.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\BonusDesk.iss"

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Replace("release-", "")
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            BonusDesk-Windows-x64.zip
            installer/output/BonusDesk-Setup-x64.exe
